<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inline message search regression</title>
<link rel="stylesheet" href="../assets/site/css/message-history.css">
<style>.fixture-host{display:flex;flex-direction:column;height:480px;width:min(360px,100%)}.fixture-feed{flex:1}body{margin:8px}#result{white-space:pre-wrap}</style>
<div id="fixtures"></div><pre id="result" data-status="running">RUNNING</pre>
<script>
const requests=[];let contextDenied=false;
window.fetch=async(url,options)=>{
 const u=new URL(url);requests.push(u);
 if(u.searchParams.has('around')){
  const id=Number(u.searchParams.get('around'));
  if(contextDenied)return {ok:false,json:async()=>({ok:false,message:'Tin nhắn không còn khả dụng.'})};
  return {ok:true,json:async()=>({ok:true,target_id:id,messages:[{id:id-1,content:'Tin trước',created_at:'2026-11-16'},
   {id,mine:true,content:'Tin khớp '+id,created_at:'2026-11-16'},{id:id+1,content:'Tin sau',created_at:'2026-11-16'}]})};
 }
 const q=u.searchParams.get('q');
 if(q==='old')await new Promise(r=>setTimeout(r,180));
 if(q==='none')return {ok:true,json:async()=>({ok:true,messages:[],has_more:false})};
 const more=u.searchParams.has('before')||u.searchParams.has('before_id');
 const messages=more?[{id:10,content:'Khớp cũ nhất',created_at:'2026-11-14'}]:[{id:30,content:q==='new'?'Kết quả mới':'<img src=x onerror=bad()>',created_at:'2026-11-16'},{id:20,content:'Khớp thứ hai',created_at:'2026-11-15'}];
 return {ok:true,json:async()=>({ok:true,messages,has_more:!more,next_before:more?0:20})};
};
</script>
<script src="../assets/site/js/message-history.js"></script>
<script>
(async()=>{
 const result=document.querySelector('#result'),fixtures=document.querySelector('#fixtures');let n=0;
 function check(ok,text){if(!ok)throw Error(text);n++}
 const tick=()=>new Promise(r=>setTimeout(r,20));
 async function until(fn){for(let i=0;i<80;i++){if(fn())return;await tick()}throw Error('Timeout: '+fn)}
 function submit(panel,value){panel.querySelector('input').value=value;panel.querySelector('form').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}))}
 try{
  for(const type of ['inbox','sticky','group']){
   fixtures.replaceChildren();requests.length=0;contextDenied=false;
   const shell=document.createElement('div');if(type==='sticky')shell.id='chat-widget';else shell.className='tk-ms';
   const host=document.createElement('div');host.className='fixture-host '+({inbox:'tk-ms-pane',sticky:'cw-convo',group:'cg-chat'}[type]);
   const header=document.createElement('header');header.className={inbox:'tk-ms-head',sticky:'cw-head',group:'cg-header'}[type];header.textContent='Tên hội thoại';
   const trigger=document.createElement('button');trigger.textContent='Tìm tin nhắn cũ';trigger.dataset.messageHistory='https://example.test/search';if(type==='group')trigger.dataset.messageHistoryCursor='before_id';header.append(trigger);
   const feed=document.createElement('div');feed.className='fixture-feed';feed.textContent='Tin đang xem';
   const draft=document.createElement('textarea');draft.value='Nội dung đang soạn';host.append(header,feed,draft);shell.append(host);fixtures.append(shell);trigger.click();
   let panel=host.querySelector('.message-history-panel');
   check(!!panel&&!document.querySelector('dialog'),'Inline without popup: '+type);
   check(document.activeElement===panel.querySelector('input')&&getComputedStyle(feed).display==='none','Search focus and feed preserved');
   submit(panel,'a');await tick();check(requests.length===0,'Short query skipped');
   submit(panel,'hello');await until(()=>panel.querySelector('.is-target')?.dataset.messageId==='30');
   check(panel.querySelector('.message-history-context').children.length===3,'Auto jump loads target and neighbors');
   check(panel.querySelector('.message-history-results:not(.message-history-context)').hidden,'Auto jump shows context');
   check(panel.querySelector('.message-history-next').disabled,'Newest result has no newer match');
   panel.querySelector('.message-history-previous').click();await until(()=>panel.querySelector('.is-target')?.dataset.messageId==='20');
   check(!panel.querySelector('.message-history-next').disabled,'Older navigation enables newer');
   panel.querySelector('.message-history-previous').click();await until(()=>panel.querySelector('.is-target')?.dataset.messageId==='10');
   check(requests.some(url=>url.searchParams.get(type==='group'?'before_id':'before')==='20'),'Arrow loads next page with correct cursor');
   check(panel.querySelector('.message-history-previous').disabled,'Oldest result disables older');
   panel.querySelector('.message-history-next').click();await until(()=>panel.querySelector('.is-target')?.dataset.messageId==='20');
   panel.querySelector('.message-history-count').click();
   const list=panel.querySelector('.message-history-results:not(.message-history-context)');
   check(!list.hidden&&list.children.length===3&&!list.querySelector('img'),'Clickable result list escapes HTML');
   list.firstElementChild.click();await until(()=>panel.querySelector('.is-target')?.dataset.messageId==='30');
   contextDenied=true;panel.querySelector('.message-history-next').click();panel.querySelector('.message-history-previous').click();
   await until(()=>panel.querySelector('.message-history-status').textContent.includes('không còn khả dụng'));
   check(!panel.querySelector('.is-target'),'Unavailable target clears old context');contextDenied=false;
   submit(panel,'old');submit(panel,'new');await until(()=>panel.querySelector('.is-target')?.dataset.messageId==='30');await new Promise(r=>setTimeout(r,220));
   check(list.firstElementChild.querySelector('p').textContent==='Kết quả mới','Stale query cannot replace results');
   const input=panel.querySelector('input');input.value='none';input.dispatchEvent(new Event('input'));await until(()=>panel.querySelector('.message-history-status').textContent.includes('Không tìm thấy'));
   check(panel.querySelector('.message-history-navigation').hidden&&!panel.querySelector('.is-target'),'Empty query result resets navigation/context');
   panel.querySelector('.message-history-back').click();check(!host.querySelector('.message-history-panel')&&getComputedStyle(feed).display!=='none'&&draft.value==='Nội dung đang soạn','Back restores chat and draft');
   trigger.click();shell.dispatchEvent(new Event(type==='sticky'?'cw:conversation-change':'inbox:change'));check(!host.querySelector('.message-history-panel'),'Changing conversation closes search');
   trigger.click();panel=host.querySelector('.message-history-panel');panel.querySelector('input').dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));check(!host.querySelector('.message-history-panel'),'Escape closes search');
  }
  result.dataset.status='pass';result.textContent='PASS: '+n+' search navigation assertions across inbox, sticky and groups';
 }catch(error){result.dataset.status='fail';result.textContent='FAIL: '+error.stack}
})();
</script>
